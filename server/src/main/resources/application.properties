spring.application.name=doctor-vet-server
server.port=8080

# Database Configuration (Persistent H2 default with full MySQL override support)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/zenvedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS & Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Deserialization Robustness
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# APITXT OTP Configuration (Read from environment variables)
apitxt.api-key=${APITXT_API_KEY:}
apitxt.api-url=${APITXT_API_URL:}

# ==============================================================================
# Mail & SMTP Configuration (Zenve Vet Automated Emails)
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:mail.zenvevet.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@zenvevet.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:noreply@zenve123}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Zenve Vet Custom Mail Settings
app.mail.from=no-reply@zenvevet.com
app.mail.sender-name=Zenve Vet
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.app-url=${APP_URL:http://localhost:5173}

# AI Integration / Google Gemini API Key
gemini.api-key=${GEMINI_API_KEY:}

# AI Integration / Anthropic Claude API Key & Model
anthropic.api-key=${ANTHROPIC_API_KEY:${CLAUDE_API_KEY:}}
anthropic.model=${ANTHROPIC_MODEL:${CLAUDE_MODEL:claude-3-5-haiku-20241022}}

# PetCare AI Grammar & Clinical Model (Trained on petcare_grammar_ai datasets)
petcare.ai.model-id=petcare-grammar-ai
petcare.ai.service-url=${PETCARE_GRAMMAR_SERVICE_URL:http://localhost:5001/correct}


